<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#8edcff"><title>Jumpin' to Sky</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:'DM Sans',system-ui,sans-serif;background:#a5e3ff;color:#19304c;touch-action:none;user-select:none;-webkit-user-select:none}#game{position:relative;width:100%;height:100%;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.topbar{position:absolute;z-index:2;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(920px,calc(100% - 32px));display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.brand{display:flex;align-items:center;gap:10px;font:700 15px 'Fredoka',sans-serif;letter-spacing:.04em;color:#205381;text-shadow:0 2px 0 rgba(255,255,255,.45)}.brand-icon{width:37px;height:37px;border-radius:13px;background:#fff9e8;box-shadow:0 4px 0 #f3c783;display:grid;place-items:center;font-size:21px}.stats{display:flex;gap:9px}.pill{min-width:76px;padding:8px 13px;border:1px solid rgba(255,255,255,.7);border-radius:16px;background:rgba(255,255,255,.72);box-shadow:0 5px 16px rgba(45,109,153,.12);text-align:center;backdrop-filter:blur(8px)}.pill small{display:block;color:#63829b;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.pill strong{font:700 19px 'Fredoka',sans-serif;color:#21496d;line-height:1.15}.icon-btn{pointer-events:auto;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.72);color:#365b77;width:40px;height:40px;border-radius:14px;font-size:18px;cursor:pointer;box-shadow:0 5px 16px rgba(45,109,153,.12)}
.overlay{position:absolute;z-index:3;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,rgba(234,248,255,.1),rgba(226,246,255,.22));transition:opacity .22s,visibility .22s}.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.card{width:min(430px,100%);padding:30px 32px 27px;background:rgba(255,252,242,.91);border:1px solid rgba(255,255,255,.95);border-radius:30px;box-shadow:0 18px 55px rgba(35,104,151,.2),inset 0 2px 0 white;text-align:center;backdrop-filter:blur(14px);animation:floatIn .5s cubic-bezier(.2,.8,.2,1) both}.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:20px;background:#e6f6ff;color:#4b88ad;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.card h1{margin:14px 0 8px;font:700 clamp(38px,9vw,54px)/.98 'Fredoka',sans-serif;letter-spacing:-.04em;color:#214d74;text-shadow:0 3px 0 #c6e8f4}.card h1 span{display:block;color:#ff806d}.card p{margin:13px auto 21px;max-width:310px;color:#668096;font-size:14px;line-height:1.55}.hero-doodle{font-size:48px;line-height:1;filter:drop-shadow(0 5px 0 rgba(67,150,185,.12));animation:bob 2.5s ease-in-out infinite}.primary{border:0;border-radius:16px;padding:14px 25px;background:linear-gradient(180deg,#ff927d,#f96f61);box-shadow:0 5px 0 #da5e54,0 11px 20px rgba(238,107,91,.25);color:#fff;font:700 16px 'Fredoka',sans-serif;letter-spacing:.02em;cursor:pointer;transition:transform .12s,filter .12s}.primary:hover{filter:brightness(1.05);transform:translateY(-2px)}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #da5e54}.hint{margin-top:19px;color:#8398a4;font-size:11px;font-weight:600}.key{display:inline-grid;place-items:center;min-width:23px;height:22px;margin:0 2px;padding:0 5px;background:white;border:1px solid #d9e7ea;border-radius:6px;color:#57768a;font-size:10px;box-shadow:0 2px 0 #dce8e7}
#pauseBtn{position:absolute;z-index:2;right:max(18px,calc((100vw - 920px)/2));top:max(18px,env(safe-area-inset-top));display:none}.playing #pauseBtn{display:block}.playing .topbar{width:min(840px,calc(100% - 120px))}#touchControls{position:absolute;z-index:2;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));display:none;justify-content:space-between;padding:0 24px;pointer-events:none}.playing #touchControls{display:flex}.touch-btn{pointer-events:auto;width:66px;height:66px;border-radius:23px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.57);box-shadow:0 6px 20px rgba(34,103,145,.15),inset 0 2px 3px white;color:#3d7599;font-size:25px;backdrop-filter:blur(8px);touch-action:none}.touch-btn:active{transform:scale(.94);background:rgba(255,255,255,.86)}#toast{position:absolute;z-index:2;left:50%;top:95px;transform:translate(-50%,-10px);padding:9px 15px;border-radius:30px;background:rgba(255,255,255,.8);color:#34749c;font-weight:800;font-size:12px;opacity:0;transition:.3s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}@keyframes floatIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}@keyframes bob{50%{transform:translateY(-7px) rotate(3deg)}}@media(max-width:600px){.topbar{width:calc(100% - 24px);top:max(12px,env(safe-area-inset-top))}.playing .topbar{width:calc(100% - 120px)}.playing .brand{font-size:0;gap:0}.brand{font-size:12px;gap:7px}.brand-icon{width:32px;height:32px;border-radius:11px;font-size:18px}.pill{min-width:57px;padding:6px 8px;border-radius:13px}.pill small{font-size:8px}.pill strong{font-size:16px}.stats{gap:5px}.icon-btn{width:38px;height:38px}.card{padding:26px 23px 24px;border-radius:26px}.card p{font-size:13px}.touch-btn{width:62px;height:62px}#toast{top:78px}}@media(min-width:850px){#touchControls{display:none!important}}
</style></head><body><main id="game"><canvas id="scene" aria-label="Jumpin' to Sky"></canvas><div class="topbar"><div class="brand"><div class="brand-icon">☁️</div> JUMPIN' TO SKY</div><div class="stats"><div class="pill"><small>Height</small><strong id="height">0 m</strong></div><div class="pill"><small>Best</small><strong id="best">0 m</strong></div><div class="pill"><small>Stars</small><strong id="stars">0</strong></div></div></div><button class="icon-btn" id="pauseBtn" aria-label="Pause">Ⅱ</button><div id="toast">⭐ Star collected!</div><div id="touchControls"><button class="touch-btn" id="leftBtn" aria-label="Move left">←</button><button class="touch-btn" id="rightBtn" aria-label="Move right">→</button></div><section class="overlay" id="overlay"><div class="card" id="card"><div class="hero-doodle">🪂</div><div class="eyebrow">☀️ &nbsp; A little sky-high adventure</div><h1>JUMPIN'<span>TO SKY</span></h1><p>Hop from cloud to cloud, scoop up shiny stars, and see how high you can go!</p><button class="primary" id="playBtn">LET'S BOUNCE! &nbsp; ↗</button><div class="hint"><span class="key">←</span><span class="key">→</span> to steer <span style="padding:0 5px">·</span> Auto-bounce <span style="padding:0 5px">·</span> Don't look down!</div></div></section><script>
(()=>{
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),game=document.getElementById('game');
const $=id=>document.getElementById(id),heightEl=$('height'),bestEl=$('best'),starsEl=$('stars'),overlay=$('overlay'),card=$('card'),playBtn=$('playBtn'),pauseBtn=$('pauseBtn'),toast=$('toast');
let W=0,H=0,dpr=1,last=0,raf=0,state='menu',score=0,starCount=0,best=0,camera=0,player=null,platforms=[],decor=[],keys={left:false,right:false},toastTimer=0;
try{best=Number(localStorage.getItem('jumpinBest'))||0}catch(e){}
bestEl.textContent=best+' m';
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(state==='menu')draw()}
window.addEventListener('resize',resize,{passive:true});
function rand(a,b){return a+Math.random()*(b-a)}
function newRun(){score=0;starCount=0;camera=0;const base=H<600?48:58;platforms=[{x:W*.5-base/2,y:35,w:base,h:14,type:'safe',star:false}];player={x:W/2,y:105,vx:0,vy:680,r:16,face:1};while(platforms[platforms.length-1].y<H+260)addPlatform();heightEl.textContent='0 m';starsEl.textContent='0';state='playing';game.classList.add('playing');overlay.classList.add('hidden');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function addPlatform(){const prev=platforms[platforms.length-1],spacing=rand(88,Math.min(126,H*.24)),w=rand(66,98),x=rand(12,Math.max(13,W-w-12)),roll=Math.random();platforms.push({x,y:prev.y+spacing,w,h:13,type:roll<.15?'moving':'normal',dx:roll<.15?rand(32,58)*(Math.random()<.5?-1:1):0,star:Math.random()<.28,phase:rand(0,7)})}
function showToast(){toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1050)}
function togglePause(){if(state==='playing'){state='paused';overlay.classList.remove('hidden');card.innerHTML='<div class="hero-doodle">⏸️</div><div class="eyebrow">☁️ &nbsp; Take a little breather</div><h1>PAUSED<span>UP HERE</span></h1><p>Your clouds will wait. Ready to keep climbing?</p><button class="primary" id="resumeBtn">KEEP BOUNCING &nbsp; ↗</button><div class="hint">Press <span class="key">P</span> or <span class="key">ESC</span> to resume</div>';document.getElementById('resumeBtn').onclick=resume;pauseBtn.textContent='▶'}else if(state==='paused')resume()}
function resume(){state='playing';overlay.classList.add('hidden');pauseBtn.textContent='Ⅱ';last=performance.now();raf=requestAnimationFrame(loop)}
function endRun(){if(state!=='playing')return;state='over';game.classList.remove('playing');overlay.classList.remove('hidden');if(score>best){best=score;bestEl.textContent=best+' m';try{localStorage.setItem('jumpinBest',best)}catch(e){}}card.innerHTML='<div class="hero-doodle">🌤️</div><div class="eyebrow">✨ &nbsp; What a sky-high trip!</div><h1>WHOOPS!<span>DOWN YOU GO</span></h1><p>You reached <b>'+score+' m</b> and collected <b>'+starCount+' star'+(starCount===1?'':'s')+'</b>. The clouds are ready for another go!</p><button class="primary" id="againBtn">BOUNCE AGAIN &nbsp; ↗</button><div class="hint">Best height: <b>'+best+' m</b> &nbsp;·&nbsp; Tap or press enter</div>';document.getElementById('againBtn').onclick=newRun;draw()}
function loop(now){if(state!=='playing')return;const dt=Math.min((now-last)/1000,.034);last=now;update(dt);draw();if(state==='playing')raf=requestAnimationFrame(loop)}
function update(dt){if(!player)return;const direction=(keys.right?1:0)-(keys.left?1:0),accel=1450,maxSpeed=360;player.vx+=direction*accel*dt;player.vx*=direction?.985:.91;player.vx=Math.max(-maxSpeed,Math.min(maxSpeed,player.vx));if(direction)player.face=direction;player.x+=player.vx*dt;if(player.x<-player.r)player.x=W+player.r;if(player.x>W+player.r)player.x=-player.r;
const oldBottom=player.y-player.r;player.vy-=1500*dt;player.y+=player.vy*dt;
for(const p of platforms){if(p.type==='moving'){p.x+=p.dx*dt;if(p.x<5||p.x+p.w>W-5)p.dx*=-1}if(player.vy<0&&oldBottom>=p.y&&player.y-player.r<=p.y&&player.x+player.r>p.x&&player.x-player.r<p.x+p.w){player.y=p.y+player.r;player.vy=p.type==='safe'?730:680;if(p.star)p.star=false}}
const target=Math.max(0,player.y-H*.56);if(target>camera)camera+=(target-camera)*Math.min(1,dt*5.5);score=Math.max(score,Math.floor(player.y/10));heightEl.textContent=score+' m';
for(const p of platforms){if(p.star&&Math.abs(player.x-(p.x+p.w/2))<p.w*.55&&Math.abs((player.y-8)-(p.y+32))<30){p.star=false;starCount++;starsEl.textContent=starCount;showToast()}}
while(platforms[platforms.length-1].y<camera+H+230)addPlatform();platforms=platforms.filter(p=>p.y>camera-120);if(player.y<camera-90)endRun()}
function cloud(x,y,w,h,color='#fff'){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y+h*.55,w*.48,h*.38,0,0,Math.PI*2);ctx.ellipse(x-w*.2,y+h*.35,w*.25,h*.43,0,0,Math.PI*2);ctx.ellipse(x+w*.1,y+h*.2,w*.29,h*.52,0,0,Math.PI*2);ctx.ellipse(x+w*.32,y+h*.4,w*.21,h*.36,0,0,Math.PI*2);ctx.fill()}
function draw(){if(!W||!H)return;const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#83d5fa');sky.addColorStop(.58,'#b8eaff');sky.addColorStop(1,'#e2f7ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
const sunX=W*.82,sunY=H*.21;const glow=ctx.createRadialGradient(sunX,sunY,5,sunX,sunY,100);glow.addColorStop(0,'rgba(255,244,187,.68)');glow.addColorStop(1,'rgba(255,244,187,0)');ctx.fillStyle=glow;ctx.fillRect(sunX-105,sunY-105,210,210);ctx.fillStyle='#fff4c4';ctx.beginPath();ctx.arc(sunX,sunY,27,0,Math.PI*2);ctx.fill();
for(let i=0;i<7;i++){const y=((i*173-camera*.18)%(H+160)+H+160)%(H+160)-70;const x=(i*197+Math.sin(i*9)*30)%(W+130)-65;cloud(x,y,randConst(i,50,100),randConst(i,22,38),'rgba(255,255,255,.42)')}
if(!player){cloud(W*.2,H*.76,140,62,'rgba(255,255,255,.76)');cloud(W*.78,H*.83,170,70,'rgba(255,255,255,.76)');drawGroundHint();return}
for(const p of platforms){const sy=H-(p.y-camera);if(sy<-40||sy>H+30)continue;const x=p.x,y=sy;ctx.save();ctx.shadowColor='rgba(53,130,170,.15)';ctx.shadowBlur=10;ctx.shadowOffsetY=5;ctx.fillStyle=p.type==='safe'?'#ffcf83':p.type==='moving'?'#b8e6ab':'#fff';roundRect(x,y-p.h,p.w,p.h+5,8);ctx.fill();ctx.shadowColor='transparent';ctx.fillStyle=p.type==='safe'?'#ffe2a7':p.type==='moving'?'#d4f1c9':'#f0fbff';ctx.beginPath();ctx.ellipse(x+p.w*.25,y-p.h+2,12,7,0,Math.PI,0);ctx.ellipse(x+p.w*.55,y-p.h,15,9,0,Math.PI,0);ctx.ellipse(x+p.w*.8,y-p.h+3,11,6,0,Math.PI,0);ctx.fill();ctx.restore();if(p.star){const sx=x+p.w*.5,sy2=y-32+Math.sin(performance.now()/260+p.phase)*3;drawStar(sx,sy2,9,'#ffd65e')}}
if(player){const sy=H-(player.y-camera);drawPlayer(player.x,sy,player.face)}
for(let i=0;i<5;i++){const x=((i*239+camera*.09)%(W+20))-10,y=((i*127+camera*.31)%(H+20))-10;ctx.globalAlpha=.35+Math.sin(performance.now()/450+i)*.18;drawStar(x,y,3,'#fff8c9')}ctx.globalAlpha=1;
}
function randConst(seed,a,b){const n=Math.sin(seed*127.1+311.7)*43758.5453;return a+(n-Math.floor(n))*(b-a)}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawStar(x,y,r,color){ctx.save();ctx.translate(x,y);ctx.rotate(performance.now()/900);ctx.fillStyle=color;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.46:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function drawPlayer(x,y,face){ctx.save();ctx.translate(x,y);ctx.scale(face,1);ctx.fillStyle='rgba(50,101,133,.13)';ctx.beginPath();ctx.ellipse(0,17,17,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff927e';ctx.beginPath();ctx.ellipse(0,3,14,15,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd2aa';ctx.beginPath();ctx.arc(0,-8,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#375a73';ctx.beginPath();ctx.arc(4,-9,1.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(-3,-9,1.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#c9705e';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(.5,-5,3,.2,Math.PI-.2);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-9,2,4,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawGroundHint(){const y=H-24;ctx.fillStyle='rgba(255,255,255,.34)';ctx.fillRect(0,y,W,24);ctx.fillStyle='rgba(54,116,151,.55)';ctx.font='600 11px DM Sans, sans-serif';ctx.textAlign='center';ctx.fillText('A tiny hop can take you anywhere',W/2,y+16)}
function inputDown(which,on){keys[which]=on}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')inputDown('left',true);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')inputDown('right',true);if(e.key==='Escape'||e.key.toLowerCase()==='p'){if(state==='playing'||state==='paused')togglePause()}if((e.key==='Enter'||e.key===' ')&&(state==='menu'||state==='over'))newRun()});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')inputDown('left',false);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')inputDown('right',false)});window.addEventListener('blur',()=>{keys.left=keys.right=false;if(state==='playing')togglePause()});
for(const [id,dir] of [['leftBtn','left'],['rightBtn','right']]){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);inputDown(dir,true)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>inputDown(dir,false))}
playBtn.onclick=newRun;pauseBtn.onclick=togglePause;overlay.addEventListener('click',e=>{if(e.target===overlay&&state==='paused')resume()});resize();draw();
})();
</script></main></body></html>
